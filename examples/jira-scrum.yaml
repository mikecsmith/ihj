# ihj workspace config — generated by bootstrap
#
# Fields are whitelists — only listed fields are displayed in the
# TUI detail view, editor, and exports. Delete any you don't need.
#
# Workspace-level 'fields' contains custom fields present on ALL
# issue types (auto-deduped by bootstrap). Per-type 'fields' holds
# fields unique to that type. Aliases must be unique across both.
#
# Jira often exposes fields with default content on types where
# they aren't relevant so you may want to move things in the workspace
# level to a specific types fields bag.
#
# Format: alias: custom_field_id
#   e.g.  story_points: 10016
#

editor: "nvim"
default_workspace: "my-board"

servers:
  my-jira:
    provider: "jira"
    url: "https://company.atlassian.net"

workspaces:
  my-board:
    server: "my-jira"
    name: "My Board"
    board_id: 42         # Required for scrum — used to look up active/future sprints
    board_type: "scrum"
    project_key: "PROJ"

    # Fields map Jira custom field IDs to semantic names.
    # Each entry becomes a {name} variable for use in JQL templates below,
    # and values are displayed in the TUI and manifests.
    #
    # Bootstrap auto-discovers fields from createmeta. Workspace-level fields
    # are present on ALL issue types (auto-promoted by bootstrap). Per-type
    # fields live in each type's own fields block below.
    fields:
      epic_link: 10014
      epic_name: 10011
      sprint: 10020
      start_date: 10015
      team: 10001

    # JQL templates — {project_key}, {id}, {name}, {slug} and any fields
    # entry are expanded at query time. See docs/jira.md for the full list.
    #
    # If using a team field, you can filter by team:
    # team_uuid: "your-team-uuid-here"
    # jql: 'project = "{project_key}" AND {team} = "{team_uuid}"'

    jql: 'project = "{project_key}" ORDER BY Rank ASC'

    # Filter names are arbitrary — add, rename, or remove to suit your workflow.
    # Each value is a JQL fragment AND-ed with the base jql above.
    # An empty string means no additional filtering.
    # "active" is used on launch by default. Switch filters with Alt+F (or f in vim mode).
    filters:
      active: "sprint IN openSprints() AND (statusCategory != Done OR resolved >= -2w)"
      me: "assignee = currentUser() AND statusCategory != Done"
      all: ""

    # Statuses define the workflow order and display colours in the TUI.
    # order: controls sort position.
    # color: black, red, green, yellow, blue, magenta, cyan, white, dim, default,
    #        or any ANSI number / hex value (e.g. "208", "#ff5733").
    statuses:
      - name: To Do
        order: 10
        color: cyan
      - name: In Progress
        order: 20
        color: blue
      - name: Done
        order: 30
        color: green

    # Issue types with sort order and display colours (same colour options as statuses).
    # has_children: whether this type can have child issues.
    # template: optional Markdown template pre-populated when creating issues of this type.
    # fields: custom fields unique to this type (bootstrap auto-discovers these).
    types:
      - id: 10000
        name: Epic
        order: 20
        color: magenta
        has_children: true
      - id: 10005
        name: Task
        order: 30
        color: default
        has_children: true
        template: |
          ## Description



          ## Acceptance Criteria

          -
          -
      - id: 10004
        name: Story
        order: 30
        color: blue
        has_children: true
        template: |
          ## User Story

          - As a
          - I want
          - So that

          ## Acceptance Criteria

          - Given
          - When
          - Then
      - id: 10007
        name: Bug
        order: 30
        color: red
        has_children: true
      - id: 10006
        name: Sub-task
        order: 40
        color: white
        has_children: false
